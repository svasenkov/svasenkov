name: Profile stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=svasenkov&show_icons=true&include_all_commits=true&hide_rank=true&theme=transparent&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # Custom top-langs: stock query takes the 100 oldest repos (createdAt ASC,
      # no orderBy), so org projects never enter the window. Own fetch keeps the
      # most recently updated repos of allowlisted owners, same renderer.
      - name: Generate top languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            --prefix "$RUNNER_TEMP/grs-core" \
            @stats-organization/github-readme-stats-core@2.2.0
          GRS_CORE_DIR="$RUNNER_TEMP/grs-core" node scripts/top-langs.mjs

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: svasenkov
          options: theme=github-compact&hide_border=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats" || exit 0
          git push
